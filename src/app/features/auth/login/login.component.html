<div class="auth-container animate-fade-in">
  <div class="auth-panel">
    <div style="margin-bottom: 30px; text-align: center;">
      <h2 style="color: var(--accent-primary); margin-bottom: 5px;">Bienvenido a</h2>
      <h3 style="color: var(--text-white); font-weight: 700; font-size: 24px;">Hackatón Pedagógica Virtual</h3>
    </div>
    
    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <div style="text-align: left; margin-bottom: 15px;">
        <input 
          type="text" 
          id="username" 
          name="username" 
          [(ngModel)]="credentials.username" 
          required
          placeholder="Usuario">
      </div>
      
      <div style="text-align: left; margin-bottom: 15px;">
        <input 
          type="password" 
          id="password" 
          name="password" 
          [(ngModel)]="credentials.password" 
          required
          placeholder="Contraseña">
      </div>

      <div *ngIf="errorMessage" style="color: var(--color-danger); margin-bottom: 20px; font-size: 14px;">
        {{ errorMessage }}
      </div>

      <button type="submit" class="btn-primary" [disabled]="isLoading">
        {{ isLoading ? 'INGRESANDO...' : 'INICIAR SESIÓN' }}
      </button>
    </form>
  </div>
</div>
