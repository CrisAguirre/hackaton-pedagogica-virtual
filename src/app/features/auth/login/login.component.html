<div class="auth-container animate-fade-in">
  <div class="auth-panel">
    <div style="margin-bottom: 30px; text-align: center;">
      <h2 style="color: var(--accent-primary); margin-bottom: 5px;">Bienvenido a</h2>
      <h3 style="color: var(--text-white); font-weight: 700; font-size: 24px;">Hackatón Pedagógica Virtual</h3>
    </div>
    
    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <div style="text-align: left; margin-bottom: 15px;">
        <input 
          type="text" 
          id="username" 
          name="username" 
          [(ngModel)]="credentials.username" 
          required
          placeholder="Usuario">
      </div>
      
      <div style="text-align: left; margin-bottom: 15px;">
        <input 
          type="password" 
          id="password" 
          name="password" 
          [(ngModel)]="credentials.password" 
          required
          placeholder="Contraseña">
      </div>

      <div *ngIf="errorMessage" style="color: var(--color-danger); margin-bottom: 20px; font-size: 14px;">
        {{ errorMessage }}
      </div>

      <button type="submit" class="btn-primary" [disabled]="isLoading">
        {{ isLoading ? 'INGRESANDO...' : 'INICIAR SESIÓN' }}
      </button>
    </form>

    <div style="margin-top: 25px; border-top: 1px solid var(--bg-medium); padding-top: 20px; text-align: center;">
      <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 10px;">Acceso Rápido (Demo)</p>
      <div style="display: flex; gap: 10px; justify-content: center;">
        <button (click)="quickLogin('student')" style="flex: 1; padding: 10px; background: rgba(79, 195, 247, 0.1); border: 1px solid var(--accent-primary); color: var(--accent-primary); border-radius: 6px; cursor: pointer; transition: 0.2s; font-size: 13px;">
          Como Invitado
        </button>
        <button (click)="quickLogin('admin')" style="flex: 1; padding: 10px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--text-muted); color: var(--text-light); border-radius: 6px; cursor: pointer; transition: 0.2s; font-size: 13px;">
          Como Docente
        </button>
      </div>
    </div>
  </div>
</div>
